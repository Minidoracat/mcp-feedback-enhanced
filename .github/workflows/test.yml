name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # publish.yml 發佈前呼叫本檔，測試沒過就不升版號、不上傳 PyPI
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint and type check
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run ruff check .
        uv run ruff format --check .
        uv run mypy

    - name: Run tests
      run: uv run pytest
